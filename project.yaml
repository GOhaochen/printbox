spec_version: "2.1"
app_id: com.bd1bwg.print
version: 0.2.5
support_arch: [amd64, arm64]
product_series: [nasync]
supports: [pc, app]
tag_types: [utility]

start_cmd: bin/qsl_print -addr=:21020
port: 21020
proxy_path: api
open_type: inner
depend_fw_version: 1.13.0.0000

permissions:
  - NETWORK.ACCESS_INTERNET

allow_add_access_path: true
only_admin: false
support_migration: true

privacy_policy_link:
  - https://raw.githubusercontent.com/GOhaochen/printbox/master/docs/privacy-policy.md
license_agreement_link:
  - https://www.gnu.org/licenses/gpl-3.0.html
source_code_link:
  - https://github.com/GOhaochen/printbox
technical_support_link:
  - mailto:support@fire-tnt.cn

i18n:
  en-US:
    name: Print & Scan
    description: Print documents and scan from your NAS to local network printers and scanners.
    author: BD1BWG
    publisher: BD1BWG
  zh-CN:
    name: 打印扫描
    description: 通过 NAS 直连局域网打印机与扫描仪，打印文档、扫描文件，一站式处理。
    author: BD1BWG
    publisher: BD1BWG

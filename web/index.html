<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>打印扫描</title>
  <link rel="stylesheet" href="/style.css?v=0.2.7">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" id="btn-home" title="返回文件"><span class="brand-name">打印扫描</span></div>
    <div class="searchbox"><input id="search" placeholder="搜索文件名，或粘贴路径后回车直达…"></div>
    <nav class="top-actions">
      <button class="btn ghost" id="btn-printer" title="打印机状态"><span class="dot" id="printer-dot"></span><span id="printer-label">打印机</span></button>
      <button class="btn ghost" data-nav="#/scan" title="扫描">扫描</button>
      <button class="btn ghost" id="btn-select" title="多选">选择</button>
      <button class="btn ghost icon" data-nav="#/settings" title="设置">⚙</button>
    </nav>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <button class="tab active" data-nav="#/files">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>文件</span>
    </button>
    <button class="tab" data-nav="#/scan">
      <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/></svg>
      <span>扫描</span>
    </button>
    <button class="tab" data-nav="#/queue">
      <svg viewBox="0 0 24 24"><path d="M6 4h12v6H6z"/><path d="M4 10h16v7H4z"/><path d="M8 17h8v3H8z"/></svg>
      <span>队列</span>
    </button>
    <button class="tab" data-nav="#/history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>历史</span>
    </button>
    <button class="tab" data-nav="#/settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 2.3a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.3h5l.4-2.3a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <div id="modal" class="modal"></div>
  <div id="toast" class="toast"></div>
  <div id="selbar" class="selbar" hidden></div>
</div>
<script type="module" src="/app.js?v=0.2.7"></script>
</body>
</html>
